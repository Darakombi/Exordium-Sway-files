# Switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# Send focused window to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# Focus window
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move focused window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right


# Window splitting
bindsym $mod+bracketleft splith
bindsym $mod+bracketright splitv

# Window functions
bindsym $mod+f fullscreen
bindsym $mod+a focus parent
bindsym $mod+q kill
bindsym $mod+Shift+q focus parent, kill

# Sway functions
bindsym $mod+Shift+e exit
bindsym $mod+Shift+r reload

# Floating windows
floating_modifier $mod normal
bindsym $mod+Shift+space floating toggle

# Cycle workspaces
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output
bindsym $mod+g layout toggle all


# Terminal
bindsym $mod+grave exec $term

# Lockscreen
bindsym $mod+Escape exec $lock

# Screenshot
#
#


# Enter mode keybinds
bindsym $mod+x mode "launch"

# Keybinds for launch mode
mode "launch" {
    # Exit mode keybinds
    bindsym $mod+x mode "default"
    bindsym Escape mode "default"

    # Main keybinds
    bindsym $mod+grave exec $term
    bindsym $mod+w exec $apps
    bindsym $mod+e exec $files
    
    bindsym $mod+b exec $browser
    bindsym $mod+n exec $incognito
    bindsym $mod+c exec $code
    bindsym $mod+Shift+c exec $code_debug
    bindsym $mod+v exec $vlc
    bindsym $mod+d exec $discord
    bindsym $mod+s exec $music

    # Other keybinds
    bindsym $mod+q kill
    bindsym $mod+Shift+q focus parent, kill
    bindsym $mod+Escape exec $lock
}

# Jump to marks
bindsym Ctrl+Alt+1 [con_mark="Browser"] focus
bindsym Ctrl+Alt+2 [con_mark="Code"] focus
bindsym Ctrl+Alt+3 [con_mark="Discord"] focus
bindsym Ctrl+Alt+4 [con_mark="Spotify"] focus
bindsym Ctrl+Alt+5 [con_mark="VLC"] focus

# Attach marks manually
bindsym Ctrl+Shift+Alt+1 mark Browser
bindsym Ctrl+Shift+Alt+2 mark Code
bindsym Ctrl+Shift+Alt+3 mark Discord
bindsym Ctrl+Shift+Alt+4 mark Spotify
bindsym Ctrl+Shift+Alt+5 mark VLC

# Clear mark
bindsym Ctrl+Alt+grave unmark
# Clear all marks
bindsym Ctrl+Shift+Alt+grave [all] unmark